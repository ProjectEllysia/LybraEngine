[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lybra-client"
version = "0.2.1"
description = "Cliente de Python del motor de escaneo Lybra (lybrad), por su socket Unix."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = []

[project.urls]
Repository = "https://github.com/ProjectEllysia/LybraEngine"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lybra_client = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
