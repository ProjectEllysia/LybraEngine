name: Oracle

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

concurrency:
  group: oracle-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            client/pyproject.toml
      - name: Install
        run: python -m pip install -e ./client -e ".[dev]"
      # A later -m on the command line overrides the -m in addopts (last wins).
      - name: Oracle tests (Docker, no real targets)
        run: python -m pytest -m oracle tests/oracle -ra
